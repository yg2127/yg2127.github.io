<text x="995.0" y="452.0" text-anchor="middle" font-size="14" font-weight="400" fill="#617181">head</text>
<rect x="1065" y="405" width="100" height="58" rx="12" fill="#fff" stroke="#8aa0ad" stroke-width="2"/>
<text x="1115.0" y="427.0" text-anchor="middle" font-size="18" font-weight="700" fill="#172b3a">Gaze</text>
<text x="1115.0" y="452.0" text-anchor="middle" font-size="14" font-weight="400" fill="#617181">head</text>
<rect x="945" y="490" width="100" height="58" rx="12" fill="#fff" stroke="#8aa0ad" stroke-width="2"/>
<text x="995.0" y="512.0" text-anchor="middle" font-size="18" font-weight="700" fill="#172b3a">Hands</text>
<text x="995.0" y="537.0" text-anchor="middle" font-size="14" font-weight="400" fill="#617181">head</text>
<rect x="1065" y="490" width="100" height="58" rx="12" fill="#fff" stroke="#8aa0ad" stroke-width="2"/>
<text x="1115.0" y="512.0" text-anchor="middle" font-size="18" font-weight="700" fill="#172b3a">Talk</text>
<text x="1115.0" y="537.0" text-anchor="middle" font-size="14" font-weight="400" fill="#617181">head</text>
