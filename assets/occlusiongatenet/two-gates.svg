<text x="462.5" y="494.0" text-anchor="middle" font-size="14" font-weight="400" fill="#617181">region gate + reliability</text>
<line x1="575" y1="476" x2="665" y2="476" stroke="#47606f" stroke-width="2.4" marker-end="url(#arrow)"/>
<polyline points="260,571 620,571 620,505 665,505" fill="none" stroke="#47606f" stroke-width="2.4" marker-end="url(#arrow)"/>
<polyline points="260,501 300,501 300,395 700,395 700,430" fill="none" stroke="#47606f" stroke-width="2.1" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="665" y="430" width="225" height="92" rx="12" fill="#fff4e9" stroke="#d2691e" stroke-width="2"/>
<text x="777.5" y="469.0" text-anchor="middle" font-size="18" font-weight="700" fill="#172b3a">Scalar pose–face gate</text>
<text x="777.5" y="494.0" text-anchor="middle" font-size="14" font-weight="400" fill="#617181">g·Pose + (1−g)·Face</text>
<line x1="890" y1="476" x2="945" y2="476" stroke="#47606f" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="945" y="405" width="100" height="58" rx="12" fill="#fff" stroke="#8aa0ad" stroke-width="2"/>
