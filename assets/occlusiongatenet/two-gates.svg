<text x="740.0" y="239.0" text-anchor="middle" font-size="14" font-weight="400" fill="#617181">region-wise selection</text>
<line x1="530" y1="180" x2="610" y2="200" stroke="#47606f" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="530" y1="260" x2="610" y2="240" stroke="#47606f" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="950" y="175" width="210" height="92" rx="12" fill="#eef8f1" stroke="#2e8b57" stroke-width="2"/>
<text x="1055.0" y="214.0" text-anchor="middle" font-size="18" font-weight="700" fill="#172b3a">Merged face</text>
<text x="1055.0" y="239.0" text-anchor="middle" font-size="14" font-weight="400" fill="#617181">478 landmarks</text>
<line x1="870" y1="221" x2="950" y2="221" stroke="#47606f" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="35" y="340" width="1180" height="260" rx="18" fill="#f4f7f4" stroke="#c4d8c9"/>
<text x="60" y="372" text-anchor="start" font-size="18" font-weight="700" fill="#2e8b57">GATE 2 · Task feature fusion</text>
