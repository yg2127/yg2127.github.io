<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 650" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">Two distinct gates</title>
<desc id="desc">Coordinate-level landmark selection occurs before task-level feature fusion.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#47606f"/></marker></defs>
<rect width="1250" height="650" fill="#ffffff"/>
<text x="625" y="42" text-anchor="middle" font-size="27" font-weight="700" fill="#172b3a">Two distinct gates</text>
<text x="625" y="71" text-anchor="middle" font-size="15" font-weight="400" fill="#617181">Gate 1 selects coordinates; Gate 2 fuses task features</text>
<rect x="35" y="100" width="1180" height="205" rx="18" fill="#eef5fb" stroke="#b8d1e5"/>
<text x="60" y="132" text-anchor="start" font-size="18" font-weight="700" fill="#2f6fb3">GATE 1 · Coordinate merge</text>
