<text x="165.0" y="224.0" text-anchor="middle" font-size="14" font-weight="400" fill="#617181">per face region</text>
<rect x="320" y="145" width="210" height="72" rx="12" fill="#fff" stroke="#2f6fb3" stroke-width="2"/>
<text x="425.0" y="174.0" text-anchor="middle" font-size="18" font-weight="700" fill="#172b3a">Visible region</text>
<text x="425.0" y="199.0" text-anchor="middle" font-size="14" font-weight="400" fill="#617181">MediaPipe coords</text>
<rect x="320" y="225" width="210" height="72" rx="12" fill="#fff" stroke="#d2691e" stroke-width="2"/>
<text x="425.0" y="254.0" text-anchor="middle" font-size="18" font-weight="700" fill="#172b3a">Occluded region</text>
<text x="425.0" y="279.0" text-anchor="middle" font-size="14" font-weight="400" fill="#617181">restored coords</text>
<line x1="255" y1="195" x2="320" y2="180" stroke="#47606f" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="255" y1="218" x2="320" y2="260" stroke="#47606f" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="610" y="175" width="260" height="92" rx="12" fill="#fff4e9" stroke="#d2691e" stroke-width="2"/>
