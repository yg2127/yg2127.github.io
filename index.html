---
layout: page
title: Home
---
{% assign entries = site.posts | concat: site.notes | sort: 'date' | reverse %}
<section class="record-browser c-archives" data-search-index="{{ '/search.json' | relative_url }}" aria-label="블로그 기록">
  <form class="search-form" role="search">
    <label class="sr-only" for="record-search">기록에서 찾기</label>
    <div class="search-field">
      <input id="record-search" type="search" name="q" placeholder="제목·태그·본문 검색" autocomplete="off">
      <button type="submit">검색</button>
    </div>
  </form>
  <div class="record-toolbar" hidden>
    <div class="record-filters" role="group" aria-label="기록 종류">
      <button type="button" data-kind="all" aria-pressed="true">전체</button>
      <button type="button" data-kind="article" aria-pressed="false">해설글</button>
      <button type="button" data-kind="note" aria-pressed="false">짧은 노트</button>
      <button type="button" data-kind="reflection" aria-pressed="false">회고</button>
    </div>
    <label class="record-sort">정렬
      <select id="record-sort"><option value="newest">최신순</option><option value="updated">최근 수정순</option></select>
    </label>
  </div>
  <h2 id="records-title" class="sr-only">모든 기록</h2>
  <p class="search-status" role="status" aria-live="polite"></p>
  <div id="record-results">{% include chronological_records.html entries=entries %}</div>
  <div class="empty-state" id="search-empty" hidden>
    <p class="empty-state__title"></p><p class="empty-state__description"></p>
    <button type="button" id="reset-search">전체 기록 보기</button>
  </div>
  <noscript><p class="notice">검색에는 JavaScript가 필요합니다. 아래 날짜별 목록이나 <a href="{{ '/stack/' | relative_url }}">Stack</a>에서 모든 글을 찾아볼 수 있습니다.</p></noscript>
</section>
<script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
